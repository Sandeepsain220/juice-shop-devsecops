name: DevSecOps SAST

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:

  contents: read
  security-events: write


jobs:

  sast:

    name: SAST Scan

    runs-on: ubuntu-latest


    steps:


      ###########################################################
      # Checkout Source Code
      ###########################################################

      - name: Checkout Source

        uses: actions/checkout@v4



      ###########################################################
      # Setup Python
      ###########################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      ###########################################################
      # Install Semgrep
      ###########################################################

      - name: Install Semgrep

        run: |

          python -m pip install --upgrade pip

          pip install semgrep



      ###########################################################
      # Run Semgrep JSON Scan
      ###########################################################

      - name: Run Semgrep JSON Report

        run: |

          semgrep scan \
          --config=auto \
          --config=.semgrep/custom-rules.yml \
          --json \
          --output semgrep-report.json \
          .



      ###########################################################
      # Run Semgrep SARIF Scan
      ###########################################################

      - name: Run Semgrep SARIF Report

      
        run: |

          semgrep scan \
          --config=auto \
          --config=.semgrep/custom-rules.yml \
          --sarif \
          --output semgrep.sarif \
          .



      ###########################################################
      # Upload Reports
      ###########################################################

      - name: Upload Semgrep Reports

        uses: actions/upload-artifact@v4

        with:

          name: semgrep-reports

          path: |

            semgrep-report.json

            semgrep.sarif



      ###########################################################
      # Upload SARIF to GitHub Security
      ###########################################################

      - name: Upload SARIF Results

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: semgrep.sarif



      ###########################################################
      # Security Gate
      ###########################################################

      - name: Security Gate (High/Critical Only)

        run: |


          python << 'EOF'


          import json

          import sys



          with open(
              "semgrep-report.json",
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)



          findings = report.get(
              "results",
              []
          )



          high_critical = 0



          for finding in findings:


              metadata = (

                  finding

                  .get("extra", {})

                  .get("metadata", {})

              )



              score = float(

                  metadata.get(

                      "security-severity",

                      0

                  )

              )



              if score >= 7.0:


                  high_critical += 1


                  print(

                      "High/Critical:",

                      finding.get("check_id"),

                      "Score:",

                      score

                  )



          print()

          print(
              "High/Critical Findings:",
              high_critical
          )



          if high_critical > 0:


              print(
                  "Security Gate FAILED"
              )

              sys.exit(1)



          else:


              print(
                  "Security Gate PASSED"
              )


          EOF

  ############################################################
# Job 2 - Secrets Scanning using Gitleaks
############################################################


  secrets-scan:


    name: Secrets Scan - Gitleaks


    runs-on: ubuntu-latest



    steps:



      - name: Checkout Source

        uses: actions/checkout@v4



      - name: Run Gitleaks


        uses: gitleaks/gitleaks-action@v2

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}