name: DevSecOps Pipeline

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:

  contents: read
  security-events: write


jobs:

  sast:

    name: SAST Scan

    runs-on: ubuntu-latest


    steps:


      ###########################################################
      # Checkout Source Code
      ###########################################################

      - name: Checkout Source

        uses: actions/checkout@v4



      ###########################################################
      # Setup Python
      ###########################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      ###########################################################
      # Install Semgrep
      ###########################################################

      - name: Install Semgrep

        run: |

          python -m pip install --upgrade pip

          pip install semgrep



      ###########################################################
      # Run Semgrep JSON Scan
      ###########################################################

      - name: Run Semgrep JSON Report

        run: |

          semgrep scan \
          --config=auto \
          --config=.semgrep/custom-rules.yml \
          --json \
          --output semgrep-report.json \
          .



      ###########################################################
      # Run Semgrep SARIF Scan
      ###########################################################

      - name: Run Semgrep SARIF Report

      
        run: |

          semgrep scan \
          --config=auto \
          --config=.semgrep/custom-rules.yml \
          --sarif \
          --output semgrep.sarif \
          .



      ###########################################################
      # Upload Reports
      ###########################################################

      - name: Upload Semgrep Reports

        uses: actions/upload-artifact@v4

        with:

          name: semgrep-reports

          path: |

            semgrep-report.json

            semgrep.sarif



      ###########################################################
      # Upload SARIF to GitHub Security
      ###########################################################

      - name: Upload SARIF Results

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: semgrep.sarif



      ###########################################################
      # Security Gate
      ###########################################################

      - name: Security Gate (High/Critical Only)

        run: |


          python << 'EOF'


          import json

          import sys



          with open(
              "semgrep-report.json",
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)



          findings = report.get(
              "results",
              []
          )



          high_critical = 0



          for finding in findings:


              metadata = (

                  finding

                  .get("extra", {})

                  .get("metadata", {})

              )



              score = float(

                  metadata.get(

                      "security-severity",

                      0

                  )

              )



              if score >= 7.0:


                  high_critical += 1


                  print(

                      "High/Critical:",

                      finding.get("check_id"),

                      "Score:",

                      score

                  )



          print()

          print(
              "High/Critical Findings:",
              high_critical
          )



          if high_critical > 0:


              print(
                  "Security Gate FAILED"
              )

              sys.exit(1)



          else:


              print(
                  "Security Gate PASSED"
              )


          EOF

  ############################################################
  ############################################################
  # Job 2 - Secrets Scanning using Gitleaks
  ############################################################

  secrets-scan:

    name: Secrets Scan - Gitleaks

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: |
          gitleaks dir . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --verbose

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif


          ############################################################
  sca:

    name: Software Composition Analysis

    runs-on: ubuntu-latest

    needs:
      - sast
      - secrets-scan

    if: always()

    steps:

      ###########################################################
      # Checkout
      ###########################################################

      - name: Checkout Source
        uses: actions/checkout@v4

      ###########################################################
      # Generate SBOM
      ###########################################################

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.json

      ###########################################################
      # Upload SBOM
      ###########################################################

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

            ###########################################################
      # Run Trivy Scan (Generate SARIF)
      ###########################################################

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif

      ###########################################################
      # Upload Trivy Report
      ###########################################################

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

      ###########################################################
      # Upload SARIF to GitHub Security
      ###########################################################

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      ###########################################################
      # Security Gate
      ###########################################################

      - name: Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1


  docker:

    name: Docker Build & Scan

    runs-on: ubuntu-latest

    needs: sca

    if: always()

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Hardened Docker Image
        run: |
          docker build \
            -f Dockerfile.hardened \
            -t juice-shop-secure .

      - name: Verify Image
        run: docker images

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop-secure
          format: sarif
          output: image-trivy.sarif

      - name: Upload Docker Scan
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-scan
          path: image-trivy.sarif