name: DevSecOps SAST

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:

    name: SAST Scan

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep (JSON Report)
        run: |
          semgrep scan \
            --config=auto \
            --config=.semgrep/custom-rules.yml \
            --json \
            --output semgrep-report.json \
            .

      - name: Run Semgrep (SARIF Report)
        run: |
          semgrep scan \
            --config=auto \
            --config=.semgrep/custom-rules.yml \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-report.json
            semgrep.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Security Gate (High/Critical Only)
        run: |
          python << 'EOF'
          import json
          import sys

          with open("semgrep-report.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          findings = report.get("results", [])

          high = 0

          for finding in findings:
              severity = finding.get("extra", {}).get("severity", "").upper()

              if severity in ["ERROR"]:
                  high += 1

          print(f"High/Critical Findings: {high}")

          if high > 0:
              print("Security Gate FAILED")
              sys.exit(1)

          print("Security Gate PASSED")
          EOF